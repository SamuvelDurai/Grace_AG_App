name: Build & Release GRACE AG APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Configure Android SDK 36.1 & accept licenses
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: ${SDKMANAGER}"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install \
              "platform-tools" \
              "platforms;android-36.1" \
              "build-tools;36.0.0" || true
            yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          fi

      - name: Restore Firebase config & signing keystore
        id: secrets_restore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          MISSING=""

          # 1. Restore app/google-services.json
          if [ ! -s app/google-services.json ]; then
            if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
              FIRST_CHAR="$(printf '%s' "${GOOGLE_SERVICES_JSON}" | tr -d '[:space:]' | cut -c1)"
              if [ "$FIRST_CHAR" = "{" ]; then
                printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
              else
                printf '%s' "${GOOGLE_SERVICES_JSON}" | tr -d '[:space:]' | base64 -d > app/google-services.json
              fi
            fi
          fi

          if [ ! -s app/google-services.json ]; then
            MISSING="${MISSING}\n- \`GOOGLE_SERVICES_JSON\` (copy contents of \`app/google-services.json\`)"
          else
            python3 -m json.tool app/google-services.json >/dev/null
          fi

          # 2. Restore debug.keystore
          KEYSTORE_SOURCE="existing"
          if [ ! -s debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
              KEYSTORE_SOURCE="project_base64"
            elif [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
              printf '%s' "${DEBUG_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 -d > debug.keystore
              KEYSTORE_SOURCE="github_secret"
            fi
          fi

          if [ ! -s debug.keystore ]; then
            MISSING="${MISSING}\n- \`DEBUG_KEYSTORE_BASE64\` (copy contents of \`debug.keystore.base64\`)"
          else
            keytool -list -keystore debug.keystore -storepass android >/dev/null
          fi

          if [ -n "$MISSING" ]; then
            {
              echo "## Missing GitHub Actions Secrets"
              echo ""
              echo "AI Studio excludes sensitive Firebase and keystore files when pushing to GitHub."
              echo "Add the following Repository Secrets under **Settings -> Secrets and variables -> Actions -> New repository secret**, then re-run this workflow:"
              echo -e "${MISSING}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing required GitHub Secrets. See Job Summary for exact setup instructions."
            exit 1
          fi

          echo "keystore_source=${KEYSTORE_SOURCE}" >> "$GITHUB_OUTPUT"

          # 3. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Read app version metadata
        id: app_version
        run: |
          VERSION_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]//g')
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE="${VERSION_CODE:-1}"
          VERSION_NAME="${VERSION_NAME:-1.0}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=grace-ag-v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Build GRACE AG APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain \
            --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            2>&1 | tee gradle-build.log

      - name: Write failure diagnostics to Job Summary
        if: failure()
        run: |
          if [ -f gradle-build.log ]; then
            {
              echo "## Build Failed Diagnostics"
              echo ""
              echo "Last 80 lines of Gradle build output:"
              echo '```text'
              tail -n 80 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare versioned and permanent latest APK files
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/${{ steps.app_version.outputs.apk_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-apk/grace-ag-latest.apk"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v6
        with:
          name: grace-ag-v${{ steps.app_version.outputs.version_name }}-apk
          path: release-apk/${{ steps.app_version.outputs.apk_name }}
          retention-days: 90

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.app_version.outputs.version_name }}"
          APK_FILE="release-apk/${{ steps.app_version.outputs.apk_name }}"
          LATEST_APK_FILE="release-apk/grace-ag-latest.apk"
          TITLE="GRACE AG v${{ steps.app_version.outputs.version_name }} (Build ${{ steps.app_version.outputs.version_code }})"
          NOTES="Automated Android APK build for GRACE AG v${{ steps.app_version.outputs.version_name }} (Version Code: ${{ steps.app_version.outputs.version_code }})."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" "$LATEST_APK_FILE" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "$APK_FILE" "$LATEST_APK_FILE" --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Write direct download link to Job Summary
        run: |
          TAG="v${{ steps.app_version.outputs.version_name }}"
          APK_NAME="${{ steps.app_version.outputs.apk_name }}"
          VERSIONED_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}"
          PERMANENT_URL="https://github.com/${{ github.repository }}/releases/latest/download/grace-ag-latest.apk"
          {
            echo "## GRACE AG APK Ready!"
            echo ""
            echo "- **Version Code:** \`${{ steps.app_version.outputs.version_code }}\`"
            echo "- **Version Name:** \`${{ steps.app_version.outputs.version_name }}\`"
            echo "- **Signing Key Source:** \`${{ steps.secrets_restore.outputs.keystore_source }}\`"
            echo "- **Permanent Always-Latest APK URL (paste once in Super Admin Updater — never needs changing):**"
            echo ""
            echo "\`\`\`"
            echo "${PERMANENT_URL}"
            echo "\`\`\`"
            echo ""
            echo "- **Versioned APK URL (this release only):**"
            echo ""
            echo "\`\`\`"
            echo "${VERSIONED_URL}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
